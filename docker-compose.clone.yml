# Isolated checkout beside the development stack.
# The base file sets `name: titan`. Without a different project name,
# `docker compose up` attaches the titan_* volumes.
#
#   $env:COMPOSE_PROJECT_NAME = "titan-clone"
#   $env:COMPOSE_FILE = "docker-compose.yml;docker-compose.clone.yml"
#
# Copy .env.clone.example to .env in that same shell. Do not reuse a
# development .env, and do not add `-v` to a `titan` project command.

services:
  kafka:
    ports: !override
      - "127.0.0.1:29092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:29092,PLAINTEXT://kafka:19092

  postgres:
    ports: !override
      - "127.0.0.1:25435:5432"

  clickhouse:
    ports: !override
      - "127.0.0.1:28123:8123"

  minio:
    ports: !override
      - "127.0.0.1:29000:9000"
      - "127.0.0.1:29001:9001"

  api:
    ports: !override
      - "127.0.0.1:28000:8000"
    environment:
      CORS_ORIGINS: http://localhost:23000

  web:
    ports: !override
      - "127.0.0.1:23000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:28000
