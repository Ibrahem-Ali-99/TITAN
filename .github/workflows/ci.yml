name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -m "not integration"
      - run: uv run python scripts/scan_secrets.py
      - run: uv run python scripts/check_supply_chain.py
      - run: uv export --frozen --all-packages --group orchestration --no-emit-workspace -o "$RUNNER_TEMP/requirements.txt"
      - run: uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements.txt"

  orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --frozen --group orchestration
      - run: mkdir -p pipelines/dagster/home
      - run: uv run --group orchestration dagster definitions validate -w pipelines/dagster/workspace.yaml
        env:
          DAGSTER_HOME: ${{ github.workspace }}/pipelines/dagster/home
          PYTHONPATH: pipelines/warehouse/src:pipelines/quality/src:pipelines/ml/src:pipelines/dagster/src

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
