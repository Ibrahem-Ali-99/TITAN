name: Build TITAN Spark image

on:
  push:
    branches: [master]
    paths:
      - infrastructure/docker/spark.Dockerfile
      - pipelines/spark/**
      - .github/workflows/spark-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish pinned Spark image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: .ci-cache/spark
          key: spark-distribution-4.0.1-hadoop3-v1
      - name: Fetch and verify Spark distribution
        shell: bash
        run: |
          mkdir -p .ci-cache/spark
          archive=.ci-cache/spark/spark-4.0.1-bin-hadoop3.tgz
          checksum="$archive.sha512"
          if [[ ! -s "$archive" || ! -s "$checksum" ]]; then
            curl --fail --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 900 --progress-bar -o "$archive" https://archive.apache.org/dist/spark/spark-4.0.1/spark-4.0.1-bin-hadoop3.tgz
            curl --fail --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 -o "$checksum" https://archive.apache.org/dist/spark/spark-4.0.1/spark-4.0.1-bin-hadoop3.tgz.sha512
          fi
          (cd .ci-cache/spark && sha512sum -c spark-4.0.1-bin-hadoop3.tgz.sha512)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        run: >-
          docker buildx build --push
          --tag ghcr.io/${{ github.repository_owner }}/titan-spark:4.0.1-${{ github.sha }}
          --cache-from type=gha,scope=titan-spark
          --cache-to type=gha,mode=max,scope=titan-spark
          --file infrastructure/docker/spark.Dockerfile .
