name: Build TITAN Spark image

on:
  push:
    branches: [master]
    paths:
      - infrastructure/docker/spark.Dockerfile
      - pipelines/spark/**
      - .github/workflows/spark-image.yml
  workflow_dispatch:

concurrency:
  group: spark-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish pinned Spark image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        run: >-
          docker buildx build --push
          --tag ghcr.io/${{ github.repository_owner }}/titan-spark:4.0.1-${{ github.sha }}
          --cache-from type=gha,scope=titan-spark
          --cache-to type=gha,mode=max,scope=titan-spark
          --file infrastructure/docker/spark.Dockerfile .
