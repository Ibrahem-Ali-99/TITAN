name: titan

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-python: &python-image
  build:
    context: .
    dockerfile: infrastructure/docker/python.Dockerfile
  logging: *default-logging

x-spark: &spark-image
  image: ${TITAN_SPARK_IMAGE:-titan-spark:4.0.1}
  build:
    context: .
    dockerfile: infrastructure/docker/spark.Dockerfile
  logging: *default-logging

x-spark-env: &spark-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  DATABASE_URL: postgresql://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD:-titan_dev_password}@postgres:5432/${POSTGRES_DB:-titan}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-titan}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-titan_dev_password}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-titan}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-titan_dev_password}
  LAKE_BUCKET: titan-lake
  CHECKPOINT_ROOT: /var/lib/titan/spark-checkpoints

services:
  kafka:
    image: apache/kafka@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f # 4.4.0
    hostname: kafka
    logging: *default-logging
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 768M

  postgres:
    image: postgres@sha256:339a86bf416979bb4d3d2e30a1f9e096e7302564faff4151b804cf53463059d5 # 18.7-alpine3.23
    logging: *default-logging
    ports:
      # Host port 5435. On the machine used to verify Day 1, 5432–5434 were
      # already taken, and a published 5432 was answered by a local PostgreSQL.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-titan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titan_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-titan}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7 # 26.8.36.3
    logging: *default-logging
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-titan}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-titan}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-titan_dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536M

  minio:
    image: alpine/minio@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4 # RELEASE-2025-10-15T17-29-55Z
    # The image process cannot initialize a root-owned named volume.
    # This is the container user, not Docker privileged mode.
    user: "0:0"
    logging: *default-logging
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-titan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-titan_dev_password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  migrate:
    <<: *python-image
    command: ["alembic", "-c", "packages/store/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD:-titan_dev_password}@postgres:5432/${POSTGRES_DB:-titan}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingestion:
    <<: *python-image
    command: ["python", "-m", "ingestion"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD:-titan_dev_password}@postgres:5432/${POSTGRES_DB:-titan}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INGESTION_HEARTBEAT_PATH: /tmp/ingestion-heartbeat
      LOG_LEVEL: INFO
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,time; p=os.environ['INGESTION_HEARTBEAT_PATH']; sys.exit(0 if time.time()-os.path.getmtime(p)<30 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    <<: *python-image
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "titan_api.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/apps/api/src",
        "--reload-dir",
        "/app/packages/store/src",
        "--reload-dir",
        "/app/packages/contracts/src",
        "--reload-dir",
        "/app/packages/messaging/src",
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD:-titan_dev_password}@postgres:5432/${POSTGRES_DB:-titan}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CORS_ORIGINS: http://localhost:3000
      TITAN_SECURITY_PROFILE: ${TITAN_SECURITY_PROFILE:-local}
      LOG_LEVEL: INFO
      TITAN_ADMIN_TOKEN: ${TITAN_ADMIN_TOKEN:-}
      TITAN_READ_TOKEN: ${TITAN_READ_TOKEN:-}
      TITAN_WRITE_TOKEN: ${TITAN_WRITE_TOKEN:-}
      WATCHFILES_FORCE_POLLING: "true"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-titan}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-titan_dev_password}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-titan}
      OTEL_ENABLED: ${OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/store/src:/app/packages/store/src
      - ./packages/contracts/src:/app/packages/contracts/src
      - ./packages/messaging/src:/app/packages/messaging/src
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/web.Dockerfile
    logging: *default-logging
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      TITAN_API_INTERNAL_URL: http://api:8000
      TITAN_DASHBOARD_LOCAL_ONLY: "true"
      TITAN_READ_TOKEN: ${TITAN_READ_TOKEN:-}
      TITAN_WRITE_TOKEN: ${TITAN_WRITE_TOKEN:-}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  lake-init:
    <<: *spark-image
    profiles: ["processing"]
    command: ["python", "-m", "titan_spark.init_lake"]
    environment:
      <<: *spark-env
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  spark-bronze:
    <<: *spark-image
    profiles: ["processing"]
    command: ["python", "-m", "titan_spark.bronze", "--trigger", "availableNow"]
    environment:
      <<: *spark-env
    volumes:
      - ./pipelines/spark:/opt/titan/pipelines/spark
      - spark_checkpoints:/var/lib/titan/spark-checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      lake-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: "no"

  spark-silver:
    <<: *spark-image
    profiles: ["processing"]
    command: ["python", "-m", "titan_spark.silver"]
    environment:
      <<: *spark-env
    volumes:
      - ./pipelines/spark:/opt/titan/pipelines/spark
      - spark_checkpoints:/var/lib/titan/spark-checkpoints
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      lake-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: "no"

  spark-tests:
    <<: *spark-image
    profiles: ["processing"]
    command: ["python", "-m", "pytest", "-q", "pipelines/spark/tests"]
    volumes:
      - ./pipelines/spark:/opt/titan/pipelines/spark
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: "no"

  dagster-daemon:
    profiles: ["orchestration"]
    build:
      context: .
      dockerfile: infrastructure/docker/orchestration.Dockerfile
    command: ["dagster-daemon", "run", "-w", "/app/pipelines/dagster/workspace.yaml"]
    environment:
      DAGSTER_HOME: /var/lib/titan/dagster
      DATABASE_URL: postgresql://titan:${POSTGRES_PASSWORD:-titan_dev_password}@postgres:5432/${POSTGRES_DB:-titan}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-titan}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-titan_dev_password}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-titan}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-titan}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-titan_dev_password}
      PYTHONPATH: /app/pipelines/dagster/src:/app/pipelines/warehouse/src
    volumes:
      - ./pipelines:/app/pipelines
      - ./warehouse:/app/warehouse
      - dagster_home:/var/lib/titan/dagster
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    restart: "no"

  event-generator:
    <<: *python-image
    profiles: ["generate"]
    entrypoint: ["python", "-m", "event_generator"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  prometheus:
    image: prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06 # v3.16.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.listen-address=0.0.0.0:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf # 13.3.1
    profiles: ["observability"]
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: titan
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-titan_dev_password}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  tempo:
    image: grafana/tempo@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044 # 3.1.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  otel-collector:
    image: otel/opentelemetry-collector@sha256:34b24b740c3c88d3467740e8642a397c13898ef76d7295c5425164c482ed1b73 # 0.165.0
    profiles: ["observability"]
    command: ["--config=/etc/otel/collector.yml"]
    volumes:
      - ./observability/otel/collector.yml:/etc/otel/collector.yml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter@sha256:3b8e05a84282cd1199ad2fb6c66f362738bf4c68c1547d8f4226a34a7dd6d8d7 # v0.21.1
    profiles: ["observability"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD:-titan_dev_password}@postgres:5432/${POSTGRES_DB:-titan}?sslmode=disable
    command:
      - "--no-collector.stat_statements"
      - "--config.file=/etc/postgres_exporter.yml"
    volumes:
      - ./observability/postgres/postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  kafka-exporter:
    image: danielqsj/kafka-exporter@sha256:54d4296c5b8ce01232f6762e06cbc3eec25887c0b5c5940ccb9e891ac7fc51d8 # v1.11.0
    profiles: ["observability"]
    command: ["--kafka.server=kafka:19092"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  kafka_data:
  postgres_data:
  clickhouse_data:
  minio_data:
  spark_checkpoints:
  web_node_modules:
  dagster_home:
  prometheus_data:
  grafana_data:
  tempo_data:
