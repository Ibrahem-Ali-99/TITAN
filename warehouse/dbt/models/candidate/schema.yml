version: 2

models:
  - name: cand_orders
    description: Accepted orders for the warehouse publication under test. Not the serving pointer.
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: order_id
        tests: [unique, not_null]
      - name: currency
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USD", "EUR", "GBP"]
      - name: total_amount
        tests: [not_null]
      - name: occurred_at
        tests: [not_null]
  - name: cand_order_items
    description: Line items for the candidate publication.
    columns:
      - name: event_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: line_amount
        tests: [not_null]
  - name: cand_payments
    description: Accepted payments for the candidate publication.
    columns:
      - name: payment_id
        tests: [unique, not_null]
      - name: currency
        tests:
          - accepted_values:
              arguments:
                values: ["USD", "EUR", "GBP"]
  - name: cand_revenue_hour
    description: Event-time order counts and revenue grouped by hour and currency.
    columns:
      - name: currency
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USD", "EUR", "GBP"]
      - name: window_start
        tests: [not_null]
