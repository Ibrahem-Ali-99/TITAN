titan:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'titan') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'titan_dev_password') }}"
      schema: "{{ env_var('CLICKHOUSE_DATABASE', 'titan') }}"
      secure: "{{ env_var('CLICKHOUSE_SECURE', 'false') | lower == 'true' }}"
      verify: "{{ env_var('CLICKHOUSE_VERIFY', 'true') | lower == 'true' }}"
      server_host_name: "{{ env_var('CLICKHOUSE_SERVER_HOST_NAME', '') }}"
