name: titan-staging

services:
  kafka:
    ports: !override []
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s
  postgres:
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?staging PostgreSQL password is required}
  clickhouse:
    ports: !override []
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?staging ClickHouse password is required}
  minio:
    ports: !override []
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?staging MinIO password is required}
  api:
    ports: !override []
    volumes: !override []
    environment:
      TITAN_SECURITY_PROFILE: protected
      TITAN_READ_TOKEN: ${TITAN_READ_TOKEN:?staging read token is required}
      TITAN_WRITE_TOKEN: ${TITAN_WRITE_TOKEN:?staging write token is required}
      TITAN_ADMIN_TOKEN: ${TITAN_ADMIN_TOKEN:?staging admin token is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?staging PostgreSQL password is required}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?staging ClickHouse password is required}
      METRICS_COLLECTOR_ENABLED: "false"
  web:
    ports: !override []
    volumes: !override
      - web_node_modules:/app/node_modules
    environment:
      TITAN_DASHBOARD_LOCAL_ONLY: "false"
      TITAN_SECURITY_PROFILE: protected
      TITAN_OIDC_ISSUER: ${TITAN_OIDC_ISSUER:?staging OIDC issuer is required}
      TITAN_OIDC_CLIENT_ID: ${TITAN_OIDC_CLIENT_ID:?staging OIDC client id is required}
      TITAN_OIDC_CLIENT_SECRET: ${TITAN_OIDC_CLIENT_SECRET:?staging OIDC client secret is required}
      TITAN_OIDC_REDIRECT_URI: ${TITAN_OIDC_REDIRECT_URI:?staging OIDC redirect URI is required}
      TITAN_OIDC_AUDIENCE: ${TITAN_OIDC_AUDIENCE:?staging OIDC audience is required}
      TITAN_OIDC_SESSION_SECRET: ${TITAN_OIDC_SESSION_SECRET:?staging OIDC session secret is required}
      TITAN_READ_TOKEN: ${TITAN_READ_TOKEN:?staging read token is required}
      TITAN_WRITE_TOKEN: ${TITAN_WRITE_TOKEN:?staging write token is required}
      TITAN_ADMIN_TOKEN: ${TITAN_ADMIN_TOKEN:?staging admin token is required}
  prometheus:
    ports: !override []
    volumes: !override
      - prometheus_data:/prometheus
  grafana:
    ports: !override []
    volumes: !override
      - grafana_data:/var/lib/grafana
  tempo:
    volumes: !override
      - tempo_data:/var/tempo
  otel-collector:
    volumes: !override []
  postgres-exporter:
    volumes: !override []
  spark-bronze:
    volumes: !override
      - spark_checkpoints:/var/lib/titan/spark-checkpoints
  spark-silver:
    volumes: !override
      - spark_checkpoints:/var/lib/titan/spark-checkpoints
  spark-tests:
    volumes: !override []
  dagster-daemon:
    image: ${TITAN_ORCHESTRATION_IMAGE:?staging orchestration image digest is required}
    volumes: !override
      - dagster_home:/var/lib/titan/dagster

volumes:
  kafka_data:
    name: titan-staging-kafka-data
  postgres_data:
    name: titan-staging-postgres-data
  clickhouse_data:
    name: titan-staging-clickhouse-data
  minio_data:
    name: titan-staging-minio-data
  spark_checkpoints:
    name: titan-staging-spark-checkpoints
  web_node_modules:
    name: titan-staging-web-node-modules
  dagster_home:
    name: titan-staging-dagster-home
  prometheus_data:
    name: titan-staging-prometheus-data
  grafana_data:
    name: titan-staging-grafana-data
  tempo_data:
    name: titan-staging-tempo-data
