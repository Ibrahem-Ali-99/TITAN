[project]
name = "titan-messaging"
version = "0.1.0"
description = "Shared Kafka topic setup and commerce event producer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka==2.16.2",
    "titan-contracts",
]

[tool.uv.sources]
titan-contracts = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
