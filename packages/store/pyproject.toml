[project]
name = "titan-store"
version = "0.1.0"
description = "Operational PostgreSQL schema for canonical commerce events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy==2.1.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
titan_store = ["py.typed"]
