[project]
name = "titan-api"
version = "0.1.0"
description = "Read API for persisted TITAN commerce events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.20",
    "titan-contracts",
    "titan-messaging",
    "titan-store",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
titan-contracts = { workspace = true }
titan-messaging = { workspace = true }
titan-store = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
