[project]
name = "titan-api"
version = "0.1.0"
description = "Read API for persisted TITAN commerce events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clickhouse-connect==1.13.0",
    "fastapi==0.165.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-sdk==1.45.2",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.31",
    "titan-contracts",
    "titan-messaging",
    "titan-store",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
titan-contracts = { workspace = true }
titan-messaging = { workspace = true }
titan-store = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
