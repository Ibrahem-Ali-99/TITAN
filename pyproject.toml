[project]
name = "titan-dev"
version = "0.1.0"
description = "TITAN local development workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "titan-api",
    "titan-contracts",
    "titan-event-generator",
    "titan-ingestion",
    "titan-messaging",
    "titan-store",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/contracts",
    "packages/messaging",
    "packages/store",
    "services/event-generator",
    "services/ingestion",
]

[tool.uv.sources]
titan-api = { workspace = true }
titan-contracts = { workspace = true }
titan-event-generator = { workspace = true }
titan-messaging = { workspace = true }
titan-ingestion = { workspace = true }
titan-store = { workspace = true }

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "httpx2==2.16.2",
    "minio==7.2.20",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]
orchestration = [
    "dagster==1.13.31",
    "dagster-webserver==1.13.31",
    "dbt-clickhouse==1.10.3",
    "dbt-core==1.12.7",
    "clickhouse-connect==1.13.0",
    "psycopg[binary]==3.3.9",
    "pyarrow==26.0.1",
    "scikit-learn==1.7.2",
    "minio==7.2.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "scripts",
    "pipelines/spark/src",
    "pipelines/warehouse/src",
    "pipelines/quality/src",
    "pipelines/ml/src",
]
markers = [
    "integration: requires the local Docker Compose stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "apps/api/src",
    "packages/contracts/src",
    "packages/messaging/src",
    "packages/store/src",
    "services/event-generator/src",
    "services/ingestion/src",
    "pipelines/spark/src",
    "pipelines/warehouse/src",
    "pipelines/dagster/src",
    "pipelines/quality/src",
    "pipelines/ml/src",
    "tests",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"apps/api/src/titan_api/main.py" = ["B008"]
"apps/api/src/titan_api/metrics.py" = ["B008"]
"apps/api/src/titan_api/routes.py" = ["B008"]
# The Spark image runs CPython 3.10, which has no datetime.UTC.
"pipelines/spark/**/*.py" = ["UP017"]

[tool.ruff.lint.isort]
known-first-party = [
    "event_generator",
    "ingestion",
    "titan_api",
    "titan_contracts",
    "titan_messaging",
    "titan_store",
    "titan_spark",
    "titan_warehouse",
    "titan_dagster",
    "titan_quality",
    "titan_ml",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["pipelines/quality/src", "pipelines/ml/src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
files = [
    "packages/contracts/src",
    "packages/messaging/src",
    "packages/store/src",
    "services/event-generator/src",
    "services/ingestion/src",
    "apps/api/src",
    "tests",
    "scripts",
    "pipelines/spark/src/titan_spark/policy.py",
    "pipelines/spark/src/titan_spark/topics.py",
    "pipelines/spark/src/titan_spark/config.py",
    "pipelines/spark/src/titan_spark/init_lake.py",
    "pipelines/warehouse/src/titan_warehouse/policy.py",
    "pipelines/quality/src/titan_quality/checks.py",
    "pipelines/ml/src/titan_ml/features.py",
]

[[tool.mypy.overrides]]
module = [
    "confluent_kafka",
    "confluent_kafka.*",
    "minio",
    "minio.*",
    "clickhouse_connect",
    "clickhouse_connect.*",
    "playwright",
    "playwright.*",
]
ignore_missing_imports = true

# pyarrow is installed with the orchestration group and publishes no type stubs.
# The default typecheck environment does not include that group.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
follow_imports = "skip"
ignore_missing_imports = true
