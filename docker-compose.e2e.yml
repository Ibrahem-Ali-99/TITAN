# Isolated reliability stack. Use only with `-p titan-e2e`.
# Host ports and the Kafka external listener differ from the development stack.
# Named volumes stay on the titan-e2e project and do not attach titan_* data.

services:
  kafka:
    ports: !override
      - "19092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:19092,PLAINTEXT://kafka:19092

  postgres:
    ports: !override
      - "15435:5432"

  clickhouse:
    ports: !override
      - "18123:8123"

  minio:
    ports: !override
      - "19000:9000"
      - "19001:9001"

  api:
    ports: !override
      - "18000:8000"
    environment:
      TITAN_ADMIN_TOKEN: e2e-local-admin
      CORS_ORIGINS: http://localhost:13000

  web:
    ports: !override
      - "13000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18000
