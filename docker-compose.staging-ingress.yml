name: titan-staging

services:
  ingress:
    image: nginx@sha256:a60ab79b8d1cbc6c0860ca9829908c5e7e83ed887034e778fc7adf0b1bfe5e47 # 1.29.4-alpine linux/amd64
    ports:
      - "127.0.0.1:${TITAN_HTTPS_PORT:-8443}:8443"
    configs:
      - source: staging_ingress
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - ingress_tls:/etc/nginx/tls:ro
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    environment:
      TITAN_DASHBOARD_LOCAL_ONLY: "false"

volumes:
  ingress_tls:
    name: ${TITAN_STAGING_VOLUME_PREFIX:-titan-staging}-ingress-tls

configs:
  staging_ingress:
    file: ./infrastructure/nginx/staging.conf
